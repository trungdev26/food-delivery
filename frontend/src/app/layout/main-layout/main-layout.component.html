<div class="flex min-h-screen flex-col bg-neutral-50">
    <header class="sticky top-0 z-20 border-b border-neutral-100 bg-white/95 backdrop-blur">
        <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
            <a routerLink="/" class="flex shrink-0 items-center gap-1.5 text-xl font-extrabold text-emerald-600">
                <span>🍔</span>
                <span>FoodGo</span>
            </a>

            <div class="hidden shrink-0 items-center gap-1 text-sm text-neutral-500 lg:flex">
                <span>📍</span>
                <span class="max-w-[160px] truncate">Q.1, TP. Hồ Chí Minh</span>
            </div>

            <div class="relative flex-1">
                <svg
                    class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-400"
                    viewBox="0 0 20 20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle cx="9" cy="9" r="6" />
                    <path d="M18 18l-4-4" stroke-linecap="round" />
                </svg>
                <input
                    type="text"
                    placeholder="Tìm món ăn, nhà hàng..."
                    class="w-full rounded-full border border-neutral-200 bg-neutral-50 py-2 pl-9 pr-4 text-sm outline-none transition-colors focus:border-emerald-500 focus:bg-white focus:ring-1 focus:ring-emerald-500"
                />
            </div>

            <button
                type="button"
                class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-neutral-600 transition-transform hover:bg-neutral-100 active:scale-90"
                aria-label="Giỏ hàng"
            >
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 4h2l2.4 12.2a2 2 0 002 1.8h8.2a2 2 0 002-1.7L20 8H6"
                    />
                    <circle cx="9" cy="20" r="1.4" />
                    <circle cx="17" cy="20" r="1.4" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-1">
        <router-outlet />
    </main>

    <footer class="border-t border-neutral-100 bg-white">
        <div class="mx-auto grid max-w-6xl gap-8 px-4 py-10 sm:grid-cols-2 lg:grid-cols-4">
            <div>
                <div class="mb-2 flex items-center gap-1.5 text-lg font-extrabold text-emerald-600">
                    <span>🍔</span>
                    <span>FoodGo</span>
                </div>
                <p class="text-sm text-neutral-500">Đặt món yêu thích, giao nhanh tận nơi.</p>
            </div>

            <div>
                <h4 class="mb-3 text-sm font-semibold text-neutral-900">Về chúng tôi</h4>
                <ul class="space-y-2 text-sm text-neutral-500">
                    <li>Giới thiệu</li>
                    <li>Tuyển dụng</li>
                    <li>Điều khoản sử dụng</li>
                </ul>
            </div>

            <div>
                <h4 class="mb-3 text-sm font-semibold text-neutral-900">Hỗ trợ</h4>
                <ul class="space-y-2 text-sm text-neutral-500">
                    <li>Trung tâm trợ giúp</li>
                    <li>Liên hệ</li>
                    <li>Đối tác nhà hàng</li>
                </ul>
            </div>

            <div>
                <h4 class="mb-3 text-sm font-semibold text-neutral-900">Kết nối</h4>
                <ul class="space-y-2 text-sm text-neutral-500">
                    <li>Facebook</li>
                    <li>Instagram</li>
                    <li>TikTok</li>
                </ul>
            </div>
        </div>

        <div class="border-t border-neutral-100 py-4 text-center text-xs text-neutral-400">
            © 2026 FoodGo. All rights reserved.
        </div>
    </footer>
</div>
